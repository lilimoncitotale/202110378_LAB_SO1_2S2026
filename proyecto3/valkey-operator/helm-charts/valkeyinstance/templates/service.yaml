apiVersion: v1
kind: Service
metadata:
  name: {{ include "valkeyinstance.fullname" . }}
  labels:
    app: {{ include "valkeyinstance.name" . }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 6379
      protocol: TCP
      name: valkey
  selector:
    app: {{ include "valkeyinstance.name" . }}