apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "valkeyinstance.fullname" . }}
  labels:
    app: {{ include "valkeyinstance.name" . }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: {{ include "valkeyinstance.name" . }}
  template:
    metadata:
      labels:
        app: {{ include "valkeyinstance.name" . }}
    spec:
      containers:
        - name: valkey
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 6379
              name: valkey
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ include "valkeyinstance.fullname" . }}-pvc
          {{- else }}
          emptyDir: {}
          {{- end }}