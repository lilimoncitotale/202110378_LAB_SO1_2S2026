apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "grafanainstance.fullname" . }}-datasource
data:
  valkey-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: valkey
        type: redis-datasource
        access: proxy
        url: mi-valkey-valkeyinstance:6379
        isDefault: true
        editable: true