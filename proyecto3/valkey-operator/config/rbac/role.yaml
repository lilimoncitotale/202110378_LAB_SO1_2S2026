apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: manager-role
rules:
##
## Base operator rules
##
# We need to get namespaces so the operator can read namespaces to ensure they exist
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - get
# We need to manage Helm release secrets
- apiGroups:
  - ""
  resources:
  - secrets
  verbs:
  - "*"
# We need to create events on CRs about things happening during reconciliation
- apiGroups:
  - ""
  resources:
  - events
  verbs:
  - create

##
## Rules for cache.mumn.com/v1, Kind: ValkeyInstance
##
- apiGroups:
  - cache.mumn.com
  resources:
  - valkeyinstances
  - valkeyinstances/status
  - valkeyinstances/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- verbs:
  - "*"
  apiGroups:
  - ""
  resources:
  - "serviceaccounts"
  - "services"
- verbs:
  - "*"
  apiGroups:
  - "apps"
  resources:
  - "deployments"
- verbs:                # ← NUEVA REGLA
  - "*"
  apiGroups:
  - ""
  resources:
  - "persistentvolumeclaims"
##
## Rules for monitoring.mumn.com/v1, Kind: GrafanaInstance
##
- apiGroups:
  - monitoring.mumn.com
  resources:
  - grafanainstances
  - grafanainstances/status
  - grafanainstances/finalizers
  verbs:
  - create
  - delete
  - get
  - list
  - patch
  - update
  - watch
- verbs:
  - "*"
  apiGroups:
  - ""
  resources:
  - "serviceaccounts"
  - "services"
- verbs:
  - "*"
  apiGroups:
  - "apps"
  resources:
  - "deployments"

- verbs:
  - "*"
  apiGroups:
  - ""
  resources:
  - "configmaps"

# +kubebuilder:scaffold:rules
