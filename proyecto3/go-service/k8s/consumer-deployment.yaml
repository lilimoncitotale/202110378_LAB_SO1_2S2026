apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumer
  labels:
    app: consumer
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consumer
  template:
    metadata:
      labels:
        app: consumer
    spec:
      containers:
        - name: consumer
          image: go-consumer:local
          imagePullPolicy: Never
          env:
            - name: RABBITMQ_URL
              value: "amqp://admin:admin123@rabbitmq:5672/"
            - name: VALKEY_ADDR
              value: "mi-valkey-valkeyinstance:6379"