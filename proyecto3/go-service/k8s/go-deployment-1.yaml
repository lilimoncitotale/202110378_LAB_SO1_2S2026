apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-deployment-1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-deployment-1
  template:
    metadata:
      labels:
        app: go-deployment-1
    spec:
      containers:
        # Contenedor 1: API REST
        - name: api-rest
          image: go-api-rest:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
          env:
            - name: GRPC_CLIENT_URL
              value: "http://localhost:8082/send-report"

        # Contenedor 2: gRPC Client
        - name: grpc-client
          image: go-grpc-client:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8082
          env:
            - name: GRPC_SERVER_ADDR
              value: "go-grpc-server:50051"
---
apiVersion: v1
kind: Service
metadata:
  name: go-deployment-1
spec:
  selector:
    app: go-deployment-1
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP