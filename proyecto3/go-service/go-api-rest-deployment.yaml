apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-api-rest
  labels:
    app: go-api-rest
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-api-rest
  template:
    metadata:
      labels:
        app: go-api-rest
    spec:
      containers:
        - name: go-api-rest
          image: go-api-rest:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8081
---
apiVersion: v1
kind: Service
metadata:
  name: go-deployment-1
spec:
  selector:
    app: go-api-rest
  ports:
    - protocol: TCP
      port: 8081
      targetPort: 8081
  type: ClusterIP