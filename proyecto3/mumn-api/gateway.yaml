apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: mumn-gateway
spec:
  gatewayClassName: traefik
  listeners:
    - name: http
      protocol: HTTP
      port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: mumn-routes
spec:
  parentRefs:
    - name: mumn-gateway
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /grpc-202110378
      backendRefs:
        - name: mumn-api
          port: 8080